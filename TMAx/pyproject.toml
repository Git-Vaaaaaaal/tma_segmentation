[project]
name = "TMAx"
version = "0.1.2"
description = "Module for segmenting pathological images of tissue microarrays"
dependencies = [
    "torch",
    "numpy",
    "huggingface_hub",
    "opencv-python",
    "pillow"
]
authors = [
    { name="BOSCH Valentin", email="val.bosch2001@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"